<div class="produtos-container">
  <h1>Nossos Produtos</h1>
  
  <div class="produtos-grid">
    <div *ngFor="let produto of produtos" class="produto-card">
      <img [src]="produto.foto" [alt]="produto.nome" class="produto-imagem">
      <div class="produto-info">
        <h3>{{ produto.nome }}</h3>
        <p class="marca">{{ produto.marca }}</p>
        <p class="descricao">{{ produto.descricao }}</p>
        <div class="produto-footer">
          <span class="preco">R$ {{ produto.preco.toLocaleString('pt-BR', { minimumFractionDigits: 2 }) }}</span>
          <span class="quantidade">{{ produto.quantidade }} em estoque</span>
        </div>
      </div>
    </div>
  </div>
</div>
